services:
  - type: web
    name: marilia-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SEED_USUARIOS_TESTE
        value: "false"
      - key: IA_PROVEDOR
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: DEMO_PROFESSOR_EMAIL
        sync: false
      - key: DEMO_PROFESSOR_SENHA
        sync: false
      - key: DEMO_ALUNO_EMAIL
        sync: false
      - key: DEMO_ALUNO_SENHA
        sync: false
