name: Manter API acordada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a API
        env:
          MARILIA_API_URL: ${{ vars.MARILIA_API_URL }}
        run: |
          if [ -z "$MARILIA_API_URL" ]; then
            echo "::warning::Variável MARILIA_API_URL não configurada (Settings > Secrets and variables > Actions > Variables)"
            exit 0
          fi
          curl -fsS --max-time 90 "$MARILIA_API_URL/" || echo "::warning::API não respondeu desta vez"
